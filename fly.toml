# Fly.io alternative to Render.
#   fly launch --no-deploy --copy-config      (once; pick a unique app name)
#   fly secrets set DATABASE_URL='postgres://…?sslmode=require'
#   fly deploy
#   fly scale count 1                          (single instance: in-process WebSocket hub)
app = "geofence-tracker-api"
primary_region = "sjc"

[build]
  image = "docker.io/DOCKERHUB_USER/geofence-tracker-backend:v1.0.0"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  ALLOWED_ORIGINS = "https://YOUR-APP.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  # Don't stop the machine when idle: it holds the WebSocket clients.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "4s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
