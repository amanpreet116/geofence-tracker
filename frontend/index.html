<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Geofencing and real-time vehicle alert dashboard" />
    <meta name="color-scheme" content="dark light" />
    <title>Geofence Tracker</title>
    <!-- Apply the saved theme before first paint (no flash). Mirrors src/theme/theme.ts. -->
    <script>
      (function () {
        var pref = "dark";
        try {
          pref = localStorage.getItem("gt-theme") || "dark";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
